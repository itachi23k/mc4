name: Build MC4 Bridge APK

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Android SDK & Build Tools
        run: |
          export ANDROID_HOME="/usr/local/lib/android/sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKM=$(find $ANDROID_HOME -name "sdkmanager" | head -1)
          echo "Found sdkmanager at: $SDKM"
          yes | $SDKM --sdk_root=$ANDROID_HOME --licenses || true
          yes | $SDKM --sdk_root=$ANDROID_HOME "cmdline-tools;latest" "build-tools;34.0.0" "platforms;android-34"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_PATH

      - name: Install ARMhf Cross-Compilation Toolchain & Dependencies
        run: |
          sudo dpkg --add-architecture armhf
          
          # Configure multi-arch APT sources: x86 from archive.ubuntu.com, armhf from ports.ubuntu.com
          sudo sed -i -e 's/deb http/deb [arch=amd64,i386] http/g' /etc/apt/sources.list
          sudo sed -i -e 's/deb https/deb [arch=amd64,i386] https/g' /etc/apt/sources.list
          
          cat << 'PORTS_EOF' | sudo tee /etc/apt/sources.list.d/ports.list
deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports/ jammy main restricted universe multiverse
deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports/ jammy-updates main restricted universe multiverse
deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports/ jammy-security main restricted universe multiverse
PORTS_EOF

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-linux-gnueabihf \
            g++-arm-linux-gnueabihf \
            libc6-armhf-cross \
            pkg-config \
            zip \
            unzip \
            file \
            libsdl2-dev:armhf \
            zlib1g-dev:armhf \
            libzip-dev:armhf \
            libgl1-mesa-dev:armhf \
            libegl1-mesa-dev:armhf \
            libgles2-mesa-dev:armhf \
            libgl1-mesa-dri:armhf \
            libegl-mesa0:armhf \
            libglapi-mesa:armhf \
            libglvnd-dev:armhf

      - name: Fetch Debian ARM64 Static QEMU
        run: |
          mkdir -p downloads/qemu-debian
          DEB_NAME=$(curl -sL "http://ftp.debian.org/debian/pool/main/q/qemu/" | grep -o 'qemu-user-static_7\.2[^"]*arm64\.deb' | head -1)
          if [ -z "$DEB_NAME" ]; then
            DEB_NAME=$(curl -sL "http://ftp.debian.org/debian/pool/main/q/qemu/" | grep -o 'qemu-user-static_[0-9][^"]*arm64\.deb' | head -1)
          fi
          echo "Downloading $DEB_NAME..."
          curl -sSL -o /tmp/qemu.deb "http://ftp.debian.org/debian/pool/main/q/qemu/$DEB_NAME"
          dpkg-deb -x /tmp/qemu.deb /tmp/qemu-deb
          cp /tmp/qemu-deb/usr/bin/qemu-arm-static downloads/qemu-debian/qemu-arm-static
          chmod +x downloads/qemu-debian/qemu-arm-static
          file downloads/qemu-debian/qemu-arm-static

      - name: Compile Game Port (ARM32 mc4)
        run: |
          mkdir -p logs
          bash build.sh

      - name: Build & Sign Release APK
        run: |
          mkdir -p logs
          cd port
          RELEASE=1 bash android/build_apk.sh
          ls -lh MC4-Bridge-*.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MC4-Bridge-APK
          path: port/MC4-Bridge-*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.4-latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Modern Combat 4 Bridge v0.4 (Latest Build)' }}
          files: port/MC4-Bridge-*.apk
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
